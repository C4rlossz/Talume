name: Validate Talume
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Scan Git history for secrets
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" --output "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts=--all .
      - name: Audit direct and transitive NuGet dependencies
        run: dotnet restore tests/Talume.MailTests -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1900%3BNU1901%3BNU1902%3BNU1903%3BNU1904%3BNU1905
      - name: Resend transport and pilot registration
        run: dotnet run --project tests/Talume.MailTests -c Release -- --export-preview preview/Talume-codigo-previa.html
      - name: Check that the preview matches the production email template
        run: git diff --exit-code -- preview/Talume-codigo-previa.html
      - name: Build application for isolated integration tests
        run: dotnet build src/Talume.Web
      - name: Existing HTTP and SMTP integration suite
        run: python3 tests/smoke.py --local dotnet
      - name: Validate production image
        run: docker build -t talume-validation .
      - name: Run production image with disposable PostgreSQL and key volume
        run: python3 tests/production-smoke.py
