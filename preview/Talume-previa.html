<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talume · Prévia interativa</title><script>// Run before CSS so the saved theme is applied before the first paint.
(() => {
    const key = 'talume.theme';
    const root = document.documentElement;
    const moon = 'M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z';
    const sun = 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v2 M12 20v2 M2 12h2 M20 12h2 M4.9 4.9l1.4 1.4 M17.7 17.7l1.4 1.4 M4.9 19.1l1.4-1.4 M17.7 6.3l1.4-1.4';
    function sync() {
        const dark = root.dataset.theme === 'dark';
        document.querySelectorAll('[data-theme-toggle]').forEach(button => {
            button.setAttribute('aria-label', 'Tema escuro');
            button.setAttribute('aria-pressed', String(dark));
            button.title = dark ? 'Voltar ao tema claro' : 'Ativar tema escuro';
            button.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${dark ? sun : moon}"/></svg><span>${dark ? 'Tema claro' : 'Tema escuro'}</span>`;
        });
    }
    function apply(theme) { root.dataset.theme = theme === 'dark' ? 'dark' : 'light'; sync(); }
    let saved = 'light';
    try { saved = localStorage.getItem(key) || 'light'; } catch { /* Storage may be disabled. */ }
    apply(saved);
    document.addEventListener('click', event => {
        if (!event.target.closest('[data-theme-toggle]')) return;
        const theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        apply(theme);
        try { localStorage.setItem(key, theme); } catch { /* Switching still works in this page. */ }
    });
    window.addEventListener('storage', event => { if (event.key === key) apply(event.newValue); });
    document.addEventListener('DOMContentLoaded', sync);
    window.TalumeTheme = { sync };
})();

async function prepareLogo(file){
    if(!file||file.size>2*1024*1024||!(/\.png$/i.test(file.name)||file.type==='image/png'))throw Error('Escolha uma imagem PNG de até 2 MB.');
    const signature=new Uint8Array(await file.slice(0,8).arrayBuffer());
    if(signature.length!==8||!signature.every((v,i)=>v===[137,80,78,71,13,10,26,10][i]))throw Error('O arquivo escolhido não é um PNG válido.');
    const header=new DataView(await file.slice(0,24).arrayBuffer());
    if(header.byteLength<24)throw Error('O arquivo PNG está incompleto.');
    const width=header.getUint32(16),height=header.getUint32(20);
    if(!width||!height||width>8000||height>8000||width*height>16000000)throw Error('Use uma logo com até 16 milhões de pixels e lados de até 8000 pixels.');
    const source=URL.createObjectURL(file),img=new Image();
    try {await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Não foi possível abrir essa imagem.'));img.src=source;});
        if(!img.naturalWidth||!img.naturalHeight||img.naturalWidth>8000||img.naturalHeight>8000)throw Error('Escolha uma logo com dimensões de até 8000 × 8000 pixels.');
        const scale=Math.min(1,1200/img.naturalWidth,1200/img.naturalHeight),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const result=canvas.toDataURL('image/png');
        if(result.length>699073)throw Error('A logo continua muito pesada. Exporte um PNG menor ou com menos detalhes.');return result;
    }finally{URL.revokeObjectURL(source);}
}

    const form=$('form',$('#modal'));form.onsubmit=async e=>{e.preventDefault();const submit=$('[type=submit]',form);submit.disabled=true;try{await onSubmit(Object.fromEntries(new FormData(form)));$('#modal').close();await reload();toast('Tudo certo. Alterações salvas.');}catch(err){const box=$('.form-error',form);box.textContent=err.message;box.style.display='block';}finally{submit.disabled=false;}};
    $('#modal').showModal();
}

function authForm(mode='login'){
    authMode=mode;const titles={login:['Bem-vindo de volta.','Entre no seu espaço e continue de onde parou.'],register:[inviteToken?'Seu projeto está aqui.':'Crie seu espaço.','Cadastre sua conta para começar.'],verify:['Confira seu e-mail.','Digite o código de 6 dígitos. Ele é válido por 10 minutos.'],forgot:['Vamos recuperar seu acesso.','Informe o e-mail da sua conta.'],resend:['Confirme seu cadastro.','Informe o e-mail para receber outro código.']};
    $('#auth-form').innerHTML=`<span class="eyebrow muted">${inviteToken?'PORTAL DO CLIENTE':'TALUME'}</span><h2 style="margin-top:18px">${titles[mode][0]}</h2><p>${titles[mode][1]}</p><form id="login-form">${mode==='register'?field('name','Seu nome','text',inviteData?.name || '','required maxlength="100" autocomplete="name"'):''}${mode!=='verify'?field('email','E-mail','email',inviteData?.email || '','required maxlength="254" autocomplete="email" '+(inviteToken&&mode==='register'?'readonly':'')):field('code','Código de confirmação','text','','required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"')}${mode==='login'||mode==='register'?field('password','Senha','password','','required '+(mode==='register'?'minlength="10" autocomplete="new-password"':'autocomplete="current-password"')):''}${mode==='register'?'<p class="form-hint">No mínimo 10 caracteres, com maiúscula, minúscula, número e símbolo.</p>':''}${mode==='verify'?field('newPassword',verifyPurpose==='reset'?'Nova senha':'Defina sua senha de acesso','password','','required minlength="10" autocomplete="new-password"')+'<p class="form-hint">Use 10 ou mais caracteres, maiúscula, minúscula, número e símbolo.</p>':''}<div class="form-error" role="alert"></div><button class="btn primary" type="submit">${mode==='login'?'Entrar no meu espaço':mode==='register'?'Criar conta':mode==='verify'?'Confirmar e continuar':'Enviar código'} ${icon('arrow')}</button></form><div class="auth-links">${mode==='login'?'<button data-auth="register">Criar conta de desenvolvedor</button><button data-auth="forgot">Esqueci minha senha</button>':'<button data-auth="login">Voltar para entrar</button><button data-auth="resend">Reenviar confirmação</button>'}</div>${mode==='login'?'<div class="auth-links"><button data-auth="resend">Ainda não confirmei meu e-mail</button></div>':''}${authDemo&&mode==='login'?`<div class="demo-accounts"><small class="muted">EXPLORAR COM DADOS FICTÍCIOS</small><button class="btn" data-demo-login="freelancer">Entrar como desenvolvedor</button><button class="btn" data-demo-login="cliente">Entrar como cliente</button></div>`:''}`;
    $('#login-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,d=Object.fromEntries(new FormData(form)),submit=$('[type=submit]',form);submit.disabled=true;try{
        if(mode==='login'){await api('/auth/login','POST',d);location.href='/';}
        if(mode==='register'){const r=await api('/auth/register','POST',{...d,invitationToken:inviteToken});challengeId=r.challengeId;verifyPurpose='confirm';authForm('verify');}
        if(mode==='forgot'||mode==='resend'){const r=await api('/auth/'+mode,'POST',d);challengeId=r.challengeId;verifyPurpose=mode==='forgot'?'reset':'confirm';authForm('verify');}
        if(mode==='verify'){await api('/auth/verify','POST',{...d,challengeId});inviteToken=null;inviteData=null;history.replaceState(null,'','/Account');authForm('login');toast('Tudo pronto. Entre com seu e-mail e senha.');}
    }catch(err){const box=$('.form-error',form);box.textContent=err.message;box.style.display='block';}finally{submit.disabled=false;}};
}
document.addEventListener('click',async e=>{
    const auth=e.target.closest('[data-auth]');if(auth){authForm(auth.dataset.auth);return;}
    const demo=e.target.closest('[data-demo-login]');if(demo){demo.disabled=true;try{await api('/auth/login','POST',{email:demo.dataset.demoLogin+'@talume.local',password:'TalumeDemo2026!'});location.href='/';}catch(err){toast(err.message);demo.disabled=false;}return;}
    const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();try{await act(el.dataset.action,el);}catch(err){toast(err.message);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-action]'))e.target.click();});
document.addEventListener('input',e=>{
    if(e.target.id==='search'){state.search=e.target.value;const start=e.target.selectionStart;$('#view').innerHTML=projects();$('#search').focus();try{$('#search').setSelectionRange(start,start);}catch{}}
    if(e.target.closest('.line-item')||e.target.id==='f-discount')quoteTotal();
});
document.addEventListener('change',async e=>{if(e.target.id==='f-logoFile'){
 const file=e.target.files[0];if(!file)return;const box=e.target.closest('.logo-picker'),submit=box.closest('form').querySelector('[type=submit]');submit.disabled=true;e.target.disabled=true;
 try {const value=await prepareLogo(file);$('[name=logoDataUrl]',box).value=value;$('.logo-swatch',box).innerHTML=`<img src="${esc(value)}" alt="Prévia da logo">`;$('.logo-error',box).textContent='';}
 catch(err){$('.logo-error',box).textContent=err.message;e.target.value='';}
 finally{submit.disabled=false;e.target.disabled=false;}return;
 }if(e.target.id==='catalog-picker' &&e.target.value){const service=state.services.find(s=>s.id===e.target.value);let line=[...document.querySelectorAll('.line-item')].find(l=>!$('[name=line-description]',l).value);if(!line){$('#quote-lines').insertAdjacentHTML('beforeend',quoteLine());line=$('#quote-lines').lastElementChild;}$('[name=line-description]',line).value=service.name;$('[name=line-price]',line).value=service.basePrice;quoteTotal();e.target.value='';}});
window.addEventListener('hashchange',()=>{if(state.me)render().catch(e=>toast(e.message));});
async function boot(){
    if($('#account')){authDemo=(await api('/auth/config')).demo;if(inviteToken){try{inviteData=await api('/auth/invitation?token='+encodeURIComponent(inviteToken));authForm('register');}catch(err){authForm('login');toast(err.message);}}else authForm();return;}
    if($('#app')){try{state.me=await api('/me');await reload();}catch(err){$('#app').innerHTML=empty('Não conseguimos abrir seu espaço',esc(err.message)+'<br><a class="btn" href="/">Tentar novamente</a>');}}
}
boot();
</script></body></html>
